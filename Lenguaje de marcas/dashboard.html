<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BurgerCRM</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">

      <div class="sidebar__logo">
        <div class="sidebar__logo-title">BurgerCRM</div>
        <div class="sidebar__logo-sub">Sistema de Gestión</div>
      </div>

      <div class="sidebar__nav">

        <a href="dashboard.html" class="sidebar__nav-item sidebar__nav-item--active">
          Dashboard
        </a>

        <a href="clientes.html" class="sidebar__nav-item">
          Clientes
        </a>

        <a href="productos.html" class="sidebar__nav-item">
          Productos
        </a>

        <a href="usuarios.html" class="sidebar__nav-item">
          Usuarios
        </a>

        <a href="ventas.html" class="sidebar__nav-item">
          Ventas
        </a>

        <a href="detalles.html" class="sidebar__nav-item">
          Detalle Venta
        </a>

      </div>

      <div class="sidebar__footer">
        BurgerCRM v1.0 · 1º DAM
      </div>

    </nav>

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar__left">

        <button class="topbar__hamburger" onclick="toggleSidebar()">
          ☰
        </button>

        <h1 class="topbar__title">
          Dashboard
        </h1>

      </div>

    </header>

<!-- MAIN -->
  <main class="main">

    <div class="kpi-grid" id="kpiGrid"></div>

    <h2 class="section-title">Últimas Ventas</h2>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Cajero</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="tbodyVentas"></tbody>
      </table>
    </div>

  </main>

</div>

<script src="js/dashboard.js"></script>
</body>
</html>
